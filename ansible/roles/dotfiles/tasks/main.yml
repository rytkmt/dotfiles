- name: Ensure parent directories exist
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - .config
    - .config/sheldon
    - .config/herdr

- name: Create symlinks
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: .zshrc,         dest: .zshrc }
    - { src: .zprofile,      dest: .zprofile }
    - { src: .inputrc,       dest: .inputrc }
    - { src: pandoc,         dest: .config/pandoc }
    - { src: nvim,           dest: .config/nvim }
    - { src: sheldon/plugins.toml, dest: .config/sheldon/plugins.toml }
    - { src: bat,            dest: .config/bat }
    - { src: peco,           dest: .config/peco }
    - { src: luacheck,       dest: .config/luacheck }
    - { src: herdr/config.toml, dest: .config/herdr/config.toml }
