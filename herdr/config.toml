onboarding = false
[keys]
prefix = "ctrl+b"
help = "prefix+?"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
settings = "prefix+shift+o"

# 分割
new_workspace = "prefix+shift+s"
close_workspace = "prefix+shift+d"
new_tab = "prefix+t"
close_tab = "prefix+d"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"

# 移動
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
previous_tab = "prefix+p"
next_tab = "prefix+n"

# 選択
workspace_picker = "prefix+shift+w"
switch_workspace = "prefix+shift+1..9"
switch_tab = "prefix+1..9"

# リネーム
rename_workspace = "prefix+shift+m"
rename_tab = "prefix+m"
rename_pane = "prefix+i"

toggle_sidebar = "prefix+b"
zoom = "prefix+z"
resize_mode = "prefix+r"

detach = "prefix+q"
reload_config = "prefix+shift+r"

new_worktree = ""
open_worktree = ""
remove_worktree = ""

remote_image_paste = "ctrl+v"

edit_scrollback = ""
last_pane = ""
previous_agent = ""
next_agent = ""
focus_agent = ""
cycle_pane_next = ""
cycle_pane_previous = ""
goto = ""
open_notification_target = ""

[ui]
right_click_passthrough_modifier = "ctrl"
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
sidebar_start_collapsed = true
prompt_new_workspace_name = true

[ui.sidebar.agents]
row_gap = 1

[ui.sidebar.spaces]
row_gap = 1

[theme]
name = "nord"
auto_switch = false

[theme.custom]
panel_bg = "#2e3440"       # サイドバー・タブバー・ステータスバーなどパネルの背景色
accent = "#88c0d0"         # アクティブなタブのボーダー、選択項目のハイライト、フォーカスインジケータ
text = "#eceff4"           # メインのテキスト色（タブ名、ペイン内テキスト等）
surface_dim = "#3b4252"    # アクティブタブの背景、ホバー前の薄い区別面
red = "#c8616a"            # エラー表示、削除系アクション、危険な操作の強調
green = "#a3be8c"          # 成功表示、追加系アクション、正常ステータス
yellow = "#ebcb8b"         # 警告表示、変更インジケータ
blue = "#81a1c1"           # リンク、情報表示、セカンダリアクセント
mauve = "#b48ead"          # キーワード、タグ、構造的要素のハイライト
peach = "#d08770"          # 関数名、バッジ、通知カウント
teal = "#8fbcbb"           # ミント系のアクセント

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "herdr pane move $HERDR_ACTIVE_PANE_ID --new-tab --focus"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "$HOME/git/dotfiles/herdr/scripts/move-pane-to-tab.sh"
width = "60%"
height = "40%"
