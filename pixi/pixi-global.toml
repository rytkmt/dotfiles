[envs.python]
channels = ["conda-forge"]
[envs.python.dependencies]
python = ">=3.12"
pip = "*"
[envs.python.exposed]
python = "python"
python3 = "python3"
pip = "pip"

[envs.node]
channels = ["conda-forge"]
[envs.node.dependencies]
nodejs = ">=22"
[envs.node.exposed]
node = "node"
npm = "npm"
npx = "npx"

[envs.deno]
channels = ["conda-forge"]
[envs.deno.dependencies]
deno = "*"
[envs.deno.exposed]
deno = "deno"

[envs.go]
channels = ["conda-forge"]
[envs.go.dependencies]
go = "*"
[envs.go.exposed]
go = "go"
gofmt = "gofmt"

[envs.lua]
channels = ["conda-forge"]
[envs.lua.dependencies]
lua = "5.1.*"
luarocks = "*"
[envs.lua.exposed]
lua = "lua"
luarocks = "luarocks"

# markitdown: 各種ファイル(Office/PDF/HTML/画像 等)をMarkdownへ変換するCLI。
# conda-forge の markitdown は PDF/DOCX/PPTX/XLSX/HTML/画像メタdata 等の
# [all] extra 相当を run 依存に含む（音声文字起こし・Azure Content Understanding は除く）。
[envs.markitdown]
channels = ["conda-forge"]
[envs.markitdown.dependencies]
markitdown = "*"
[envs.markitdown.exposed]
markitdown = "markitdown"
